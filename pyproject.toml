[project]
name = "local-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muzammil", email = "sharfmuzamil@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "odfpy>=1.4.1",
    "ollama>=0.6.3",
    "pymupdf>=2.1",
    "spotipy>=2.26.0",
]

[project.scripts]
local-assistant = "local_assistant:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
